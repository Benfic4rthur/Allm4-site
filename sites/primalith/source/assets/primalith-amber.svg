<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background squircle shadow -->
    <filter id="squircleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#78350f" flood-opacity="0.35"/>
    </filter>

    <!-- Deep Jurassic Amber radial glow -->
    <radialGradient id="amberSquircle" cx="48%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="65%" stop-color="#d97706" />
      <stop offset="90%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#451a03" />
    </radialGradient>

    <!-- Squircle border bevel rim -->
    <linearGradient id="squircleRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#451a03" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Translucent amber cube gradients -->
    <radialGradient id="cubeCore" cx="48%" cy="46%" r="54%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="75%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </radialGradient>

    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Squircle clip for icon face -->
    <clipPath id="squircleClip">
      <rect x="64" y="64" width="896" height="896" rx="200" ry="200"/>
    </clipPath>
    
    <!-- Cube clip for internal fossil -->
    <clipPath id="cubeInside">
      <polygon points="512,180 840,369 840,735 512,910 184,735 184,369"/>
    </clipPath>
  </defs>

  <!-- Squircle Base with drop shadow -->
  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="url(#amberSquircle)" filter="url(#squircleShadow)"/>

  <!-- Subtle inner squircle border -->
  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="none" stroke="url(#squircleRim)" stroke-width="8" clip-path="url(#squircleClip)"/>

  <!-- High-tech grid overlay inside amber -->
  <g stroke="#ffffff" stroke-width="2" stroke-opacity="0.12" clip-path="url(#squircleClip)">
    <line x1="128" y1="64" x2="128" y2="960"/>
    <line x1="256" y1="64" x2="256" y2="960"/>
    <line x1="384" y1="64" x2="384" y2="960"/>
    <line x1="512" y1="64" x2="512" y2="960"/>
    <line x1="640" y1="64" x2="640" y2="960"/>
    <line x1="768" y1="64" x2="768" y2="960"/>
    <line x1="896" y1="64" x2="896" y2="960"/>
    
    <line x1="64" y1="128" x2="960" y2="128"/>
    <line x1="64" y1="256" x2="960" y2="256"/>
    <line x1="64" y1="384" x2="960" y2="384"/>
    <line x1="64" y1="512" x2="960" y2="512"/>
    <line x1="64" y1="640" x2="960" y2="640"/>
    <line x1="64" y1="768" x2="960" y2="768"/>
    <line x1="64" y1="896" x2="960" y2="896"/>
  </g>

  <!-- 3D Voxel Isometric Amber Block -->
  <g clip-path="url(#squircleClip)">
    <!-- Main isometric cube fill -->
    <polygon points="512,180 840,369 840,735 512,910 184,735 184,369" fill="url(#cubeCore)"/>

    <!-- Internal 3D corner depth lines -->
    <g stroke="#451a03" stroke-width="12" stroke-opacity="0.45" fill="none" clip-path="url(#cubeInside)">
      <line x1="512" y1="180" x2="512" y2="550"/>
      <line x1="184" y1="735" x2="512" y2="550"/>
      <line x1="840" y1="735" x2="512" y2="550"/>
    </g>

    <!-- Fossil Glow Silhouette & Amber T-Rex -->
    <g clip-path="url(#cubeInside)">
      <!-- Amber glow halo around dinosaur fossil -->
      <g transform="translate(195, 200) scale(10.2)">
        <path
          d="M 14 34 Q 18 41 25 40 L 26 46 L 23 48 L 30 48 L 29.5 44.5 L 32.5 41 L 35 46 L 33 48 L 39 48 L 38 44 L 37 37.5 L 40.5 34.5 L 44 35.5 L 43 37.5 L 39.5 36.5 L 38.5 31.5 L 41 26.5 L 47.5 27.5 L 47.5 25.5 L 42 24.5 L 44.5 23 L 49.5 23.2 L 50.2 19 Q 48.2 16 42 16 Q 36.8 16 34.8 20.5 Q 31.8 25.5 27 28.2 Q 21 31.2 14 34 Z"
          fill="#fef08a"
          opacity="0.4"
          filter="blur(1px)"
        />
        <!-- Obsidian Fossil Body -->
        <path
          d="M 14 34 Q 18 41 25 40 L 26 46 L 23 48 L 30 48 L 29.5 44.5 L 32.5 41 L 35 46 L 33 48 L 39 48 L 38 44 L 37 37.5 L 40.5 34.5 L 44 35.5 L 43 37.5 L 39.5 36.5 L 38.5 31.5 L 41 26.5 L 47.5 27.5 L 47.5 25.5 L 42 24.5 L 44.5 23 L 49.5 23.2 L 50.2 19 Q 48.2 16 42 16 Q 36.8 16 34.8 20.5 Q 31.8 25.5 27 28.2 Q 21 31.2 14 34 Z"
          fill="#2b1104"
          stroke="#1c0b02"
          stroke-width="0.75"
        />
        <!-- Glowing Amber Core Eye -->
        <circle cx="43.8" cy="18.8" r="1.3" fill="#fef08a" />
        <circle cx="43.8" cy="18.8" r="0.6" fill="#ef4444" />
      </g>
    </g>

    <!-- Translucent 3D Glass Faces Overlay -->
    <polygon points="512,180 840,369 512,550 184,369" fill="url(#cubeTop)"/>
    <polygon points="184,369 512,550 512,910 184,735" fill="url(#cubeLeft)"/>
    <polygon points="512,550 840,369 840,735 512,910" fill="url(#cubeRight)"/>

    <!-- Sharp 3D isometric cube edges -->
    <polygon points="512,180 840,369 840,735 512,910 184,735 184,369" fill="none" stroke="#fef08a" stroke-width="4" stroke-opacity="0.8"/>
  </g>
</svg>
