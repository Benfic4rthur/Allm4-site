name: Prepare official Allm4 social preview

on:
  push:
    branches:
      - maintenance/prepare-social-preview-20260924
    paths:
      - .github/workflows/prepare-social-preview.yml

permissions:
  contents: write

concurrency:
  group: prepare-official-social-preview
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated maintenance branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: maintenance/prepare-social-preview-20260924
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
      - name: Install existing dependencies
        run: npm ci
      - name: Replace only the obsolete icon
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile, writeFile, mkdir, copyFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import sharp from 'sharp';

          const originalPath = 'public/images/allm4-social-preview.png';
          const resultPath = 'public/images/allm4-social-preview-v2.png';
          const iconPath = 'public/images/allm4-coupon-icon.png';
          const original = await readFile(originalPath);
          const official = await readFile(iconPath);
          const blobSha = b => createHash('sha1').update(`blob ${b.length}\0`).update(b).digest('hex');
          assert.equal(blobSha(original), '364a8404840bf861e839bd77dad5a6ead190e312');
          assert.equal(blobSha(official), '2cdabc0f147ace53d016fafb11a880f1ed02bd8c');
          const { data: source, info } = await sharp(original).ensureAlpha().raw().toBuffer({ resolveWithObject: true });
          assert.equal(info.width, 1200);
          assert.equal(info.height, 630);
          assert.equal(info.channels, 4);
          const pixel = (x, y, c = 0) => (y * info.width + x) * 4 + c;
          let minX = Infinity, minY = Infinity, maxX = -1, maxY = -1, orangePixels = 0;
          for (let y = 24; y < 130; y++) {
            for (let x = 32; x < 134; x++) {
              const i = pixel(x, y);
              const [r, g, b] = source.subarray(i, i + 3);
              if (r >= 180 && g >= 40 && r - g > 40 && b < g + 20) {
                minX = Math.min(minX, x); maxX = Math.max(maxX, x);
                minY = Math.min(minY, y); maxY = Math.max(maxY, y);
                orangePixels++;
              }
            }
          }
          const oldWidth = maxX - minX + 1, oldHeight = maxY - minY + 1;
          assert.ok(orangePixels > 800 && oldWidth >= 40 && oldWidth <= 76 && oldHeight >= 40 && oldHeight <= 76, 'Unexpected original icon; refusing broad edits');
          const left = minX - 2, top = minY - 2, right = maxX + 2, bottom = maxY + 2;
          const restored = Buffer.from(source);
          // Restore only the old logo rectangle from its immediately adjacent background.
          for (let y = top; y <= bottom; y++) {
            for (let x = left; x <= right; x++) {
              const t = (x - left + 1) / (right - left + 2);
              for (let c = 0; c < 4; c++) {
                restored[pixel(x, y, c)] = Math.round(source[pixel(left - 1, y, c)] * (1 - t) + source[pixel(right + 1, y, c)] * t);
              }
            }
          }
          // This is the user's exact official PNG. The outer padding is transparent, not white.
          const iconSize = Math.max(oldWidth, oldHeight) + 8;
          const icon = await sharp(official)
            .extract({ left: 167, top: 165, width: 979, height: 895 })
            .resize(iconSize, iconSize, { fit: 'contain', background: { r: 0, g: 0, b: 0, alpha: 0 } })
            .png().toBuffer();
          const iconLeft = Math.round((minX + maxX + 1 - iconSize) / 2);
          const iconTop = Math.round((minY + maxY + 1 - iconSize) / 2);
          const result = await sharp(restored, { raw: { width: info.width, height: info.height, channels: 4 } })
            .composite([{ input: icon, left: iconLeft, top: iconTop }])
            .png({ compressionLevel: 9, adaptiveFiltering: true }).toBuffer();
          const actual = await sharp(result).ensureAlpha().raw().toBuffer();
          const bounds = {
            left: Math.min(left, iconLeft), top: Math.min(top, iconTop),
            right: Math.max(right + 1, iconLeft + iconSize), bottom: Math.max(bottom + 1, iconTop + iconSize),
          };
          let changedPixels = 0;
          for (let y = 0; y < info.height; y++) {
            for (let x = 0; x < info.width; x++) {
              const i = pixel(x, y);
              if (!actual.subarray(i, i + 4).equals(source.subarray(i, i + 4))) {
                assert.ok(x >= bounds.left && x < bounds.right && y >= bounds.top && y < bounds.bottom, `Unexpected change outside logo at ${x},${y}`);
                changedPixels++;
              }
            }
          }
          assert.ok(changedPixels > 500);
          await writeFile(resultPath, result);
          const layoutPath = 'app/layout.tsx';
          const layout = await readFile(layoutPath, 'utf8');
          const oldRef = 'const socialPreview = "/images/allm4-social-preview.png";';
          assert.equal(layout.split(oldRef).length, 2);
          await writeFile(layoutPath, layout.replace(oldRef, 'const socialPreview = "/images/allm4-social-preview-v2.png";'));
          await mkdir('/tmp/allm4-preview-review', { recursive: true });
          await copyFile(originalPath, '/tmp/allm4-preview-review/before.png');
          await copyFile(resultPath, '/tmp/allm4-preview-review/after.png');
          await sharp(result).extract({ left: 40, top: 40, width: 400, height: 96 }).png().toFile('/tmp/allm4-preview-review/header.png');
          const report = { originalBlob: blobSha(original), officialIconBlob: blobSha(official), resultBlob: blobSha(result), dimensions: [info.width, info.height], originalIcon: { minX, minY, maxX, maxY }, changedBounds: bounds, changedPixels, changedPixelsOutsideLogo: 0, resultBytes: result.length };
          await writeFile('/tmp/allm4-preview-review/report.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          NODE
      - name: Validate TypeScript
        run: npx tsc --noEmit
      - name: Validate lint
        run: npm run lint
      - name: Validate existing tests
        run: node --experimental-strip-types --test tests/*.test.mjs
      - name: Build static site
        env:
          GITHUB_PAGES: "true"
          PAGES_BASE_PATH: ""
          NEXT_PUBLIC_BASE_PATH: ""
        run: npx next build
      - name: Verify exported image and sharing metadata
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const image = await readFile('public/images/allm4-social-preview-v2.png');
          assert.deepEqual(await readFile('out/images/allm4-social-preview-v2.png'), image);
          const html = await readFile('out/index.html', 'utf8');
          assert.match(html, /property="og:image" content="https:\/\/allm4\.com\/images\/allm4-social-preview-v2\.png"/);
          assert.match(html, /name="twitter:image" content="https:\/\/allm4\.com\/images\/allm4-social-preview-v2\.png"/);
          console.log('Exported PNG, Open Graph and Twitter metadata verified.');
          NODE
      - name: Save visual review artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: allm4-preview-official-icon
          path: /tmp/allm4-preview-review
          retention-days: 3
      - name: Commit only the corrected asset and metadata to the isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/images/allm4-social-preview-v2.png app/layout.tsx
          git commit -m "fix: use the official Allm4 icon in the social preview"
          git push origin HEAD:maintenance/prepare-social-preview-20260924
