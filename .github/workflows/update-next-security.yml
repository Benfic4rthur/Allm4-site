name: Refresh Next security lock

on:
  push:
    branches:
      - feature/allm4-umbrella-brand
    paths:
      - .github/workflows/update-next-security.yml

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm

      - name: Refresh vulnerable production dependencies
        run: |
          npm install next@16.3.8 --save-exact
          npm audit fix --omit=dev
          npm audit --omit=dev --audit-level=moderate

      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update production dependencies for security"
          git push origin HEAD:feature/allm4-umbrella-brand
