name: Inspect staged Allm4 media
on:
  push:
    branches: [maintenance/site-media-assemble-20260925]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Reassemble candidate media
        run: |
          mkdir -p media-out
          cat .media-chunks/{01,02,03,04,05}.bin > media-out/group1.bin
          cat .media-chunks/{06,07,08,09,10}.bin > media-out/group2.bin
          cat .media-chunks/{11,12,13,14,15}.bin > media-out/group3.bin
          sha256sum media-out/*
          file media-out/*
          ls -lh media-out/*
      - name: Upload candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: allm4-media-candidates
          path: media-out/
          retention-days: 2
