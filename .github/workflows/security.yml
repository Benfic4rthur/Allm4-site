name: Security checks

on:
  push:
  pull_request:
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npx tsc --noEmit

      - name: Validate release parsing
        run: node --experimental-strip-types --test tests/releases.test.mjs

      - name: Build production export
        env:
          GITHUB_PAGES: "true"
          PAGES_BASE_PATH: ""
          NEXT_PUBLIC_BASE_PATH: ""
        run: npx next build
